name: v006-r2-human-reference

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact ep52-h1-recovery commit SHA to bind
        required: true
        type: string
      confirmation:
        description: Enter ACTUATE_R2_<first12 source_sha>
        required: true
        type: string

permissions:
  contents: read

jobs:
  r2_human_actuated_reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Run bounded human-actuated v006 R2 reference
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          GH_READ_CREDENTIAL: ${{ github.token }}
        run: node scripts/run-v006-r2-human-actuated-reference.mjs
      - name: Upload v006 R2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ep52-v006-r2-${{ inputs.source_sha }}
          path: artifacts/ep52/v006/live-references/r2.json
          if-no-files-found: error
          retention-days: 7
